name: Auto-Render Mermaid Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**/*.mmd'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render Mermaid to SVG
        uses: neoromantic/mermaid-cli-action@v1
        with:
          input: 'docs/diagrams/resource-ranking.mmd'
          output: 'docs/diagrams/resource-ranking.svg'

      - name: Commit updated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*.svg
          git commit -m "chore: auto-render updated mermaid diagrams [skip ci]" || echo "No changes to commit"
          git push
